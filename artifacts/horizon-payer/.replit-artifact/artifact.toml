kind = "web"
previewPath = "/"
title = "Horizon Payer Command Center"
version = "1.0.0"
id = "artifacts/horizon-payer"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24856

[services.development]
run = "pnpm --filter @workspace/horizon-payer run dev"

[services.env]
PORT = "24856"
BASE_PATH = "/"

[services.production]
serve = "static"
publicDir = "artifacts/horizon-payer/dist/public"

[services.production.build]
args = ["sh", "-c", "PORT=3000 BASE_PATH=/ pnpm --filter @workspace/horizon-payer run build"]

[services.production.build.env]
NODE_ENV = "production"
