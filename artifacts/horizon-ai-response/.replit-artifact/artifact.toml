kind = "slides"
previewPath = "/horizon-ai-response/"
title = "Horizon AI Transformation Response"
version = "1.0.0"
id = "artifacts/horizon-ai-response"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/horizon-ai-response/" ]
localPort = 21806

[services.development]
run = "pnpm --filter @workspace/horizon-ai-response run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/horizon-ai-response", "run", "build" ]
publicDir = "artifacts/horizon-ai-response/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21806"
BASE_PATH = "/horizon-ai-response/"
