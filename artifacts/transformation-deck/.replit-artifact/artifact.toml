kind = "slides"
previewPath = "/transformation-deck/"
title = "CareOps360 Transformation Deck"
version = "1.0.0"
id = "artifacts/transformation-deck"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/transformation-deck/" ]
localPort = 24087

[services.development]
run = "pnpm --filter @workspace/transformation-deck run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/transformation-deck", "run", "build" ]
publicDir = "artifacts/transformation-deck/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24087"
BASE_PATH = "/transformation-deck/"
