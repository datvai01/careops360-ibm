kind = "slides"
previewPath = "/ams-executive-summary/"
title = "IBM × Horizon AMS Executive Summary"
version = "1.0.0"
id = "artifacts/ams-executive-summary"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/ams-executive-summary/" ]
localPort = 18409

[services.development]
run = "pnpm --filter @workspace/ams-executive-summary run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ams-executive-summary", "run", "build" ]
publicDir = "artifacts/ams-executive-summary/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18409"
BASE_PATH = "/ams-executive-summary/"
