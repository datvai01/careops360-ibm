openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Horizon Payer Command Center API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: executive
    description: Executive overview KPIs
  - name: members
    description: Member enrollment data
  - name: claims
    description: Claims operations data
  - name: priorauth
    description: Prior authorization data
  - name: providers
    description: Provider operations data
  - name: contactcenter
    description: Contact center / member service data
  - name: vendor-invoices
    description: Vendor invoice and billing management
  - name: applications
    description: Application health and incidents
  - name: ibmams
    description: IBM AMS value and metrics
  - name: roadmap
    description: Digital roadmap initiatives and planning
  - name: auth
    description: Authentication
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  /executive/kpis:
    get:
      operationId: getExecutiveKpis
      tags: [executive]
      summary: Get executive-level KPIs
      responses:
        "200":
          description: Executive KPIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutiveKpis"

  /executive/alerts:
    get:
      operationId: getAlerts
      tags: [executive]
      summary: Get active operational alerts
      responses:
        "200":
          description: Active alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

  /executive/snapshot:
    get:
      operationId: getOperationsSnapshot
      tags: [executive]
      summary: Get today's operations snapshot
      responses:
        "200":
          description: Operations snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsSnapshot"

  /executive/trends:
    get:
      operationId: getExecutiveTrends
      tags: [executive]
      summary: Get 30-day trend data for key metrics
      responses:
        "200":
          description: Trend data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrendData"

  /members/kpis:
    get:
      operationId: getMemberKpis
      tags: [members]
      summary: Get member enrollment KPIs
      parameters:
        - name: dateRange
          in: query
          schema:
            type: string
        - name: productLine
          in: query
          schema:
            type: string
        - name: region
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Member KPIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberKpis"

  /members/enrollments:
    get:
      operationId: getEnrollmentTrends
      tags: [members]
      summary: Get enrollment trends by day/week/month
      responses:
        "200":
          description: Enrollment trends
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentTrends"

  /members/by-product:
    get:
      operationId: getMembersByProduct
      tags: [members]
      summary: Get member counts by product line
      responses:
        "200":
          description: Members by product
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MembersByProduct"

  /members/by-region:
    get:
      operationId: getMembersByRegion
      tags: [members]
      summary: Get member counts by region
      responses:
        "200":
          description: Members by region
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MembersByRegion"

  /members/exceptions:
    get:
      operationId: getEnrollmentExceptions
      tags: [members]
      summary: Get enrollment exception queue
      responses:
        "200":
          description: Enrollment exceptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnrollmentException"

  /claims/kpis:
    get:
      operationId: getClaimsKpis
      tags: [claims]
      summary: Get claims operations KPIs
      parameters:
        - name: dateRange
          in: query
          schema:
            type: string
        - name: lineOfBusiness
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Claims KPIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimsKpis"

  /claims/queue:
    get:
      operationId: getClaimsQueue
      tags: [claims]
      summary: Get claims queue with aging
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Claims queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimsQueueResponse"

  /claims/denial-reasons:
    get:
      operationId: getDenialReasons
      tags: [claims]
      summary: Get top claim denial reasons
      responses:
        "200":
          description: Denial reasons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DenialReason"

  /claims/by-line-of-business:
    get:
      operationId: getClaimsByLineOfBusiness
      tags: [claims]
      summary: Get claims by line of business
      responses:
        "200":
          description: Claims by LOB
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClaimsByLob"

  /claims/aging:
    get:
      operationId: getClaimsAging
      tags: [claims]
      summary: Get claims backlog aging buckets
      responses:
        "200":
          description: Claims aging
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgingBucket"

  /priorauth/kpis:
    get:
      operationId: getPriorAuthKpis
      tags: [priorauth]
      summary: Get prior authorization KPIs
      parameters:
        - name: dateRange
          in: query
          schema:
            type: string
        - name: requestType
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Prior auth KPIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriorAuthKpis"

  /priorauth/aging:
    get:
      operationId: getPriorAuthAging
      tags: [priorauth]
      summary: Get prior auth backlog aging by bucket
      responses:
        "200":
          description: Prior auth aging
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgingBucket"

  /priorauth/top-procedures:
    get:
      operationId: getTopProcedures
      tags: [priorauth]
      summary: Get top procedure categories for prior auth
      responses:
        "200":
          description: Top procedures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProcedureCategory"

  /priorauth/workload:
    get:
      operationId: getReviewerWorkload
      tags: [priorauth]
      summary: Get nurse/reviewer workload data
      responses:
        "200":
          description: Reviewer workload
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewerWorkload"

  /providers/kpis:
    get:
      operationId: getProviderKpis
      tags: [providers]
      summary: Get provider operations KPIs
      responses:
        "200":
          description: Provider KPIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderKpis"

  /providers/list:
    get:
      operationId: getProviderList
      tags: [providers]
      summary: Get provider list with status
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Provider list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderListResponse"

  /providers/issues:
    get:
      operationId: getProviderIssues
      tags: [providers]
      summary: Get top provider service issues
      responses:
        "200":
          description: Provider issues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderIssue"

  /contactcenter/kpis:
    get:
      operationId: getContactCenterKpis
      tags: [contactcenter]
      summary: Get contact center KPIs
      parameters:
        - name: dateRange
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Contact center KPIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactCenterKpis"

  /contactcenter/call-reasons:
    get:
      operationId: getTopCallReasons
      tags: [contactcenter]
      summary: Get top call reasons
      responses:
        "200":
          description: Top call reasons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CallReason"

  /contactcenter/hourly-volume:
    get:
      operationId: getHourlyCallVolume
      tags: [contactcenter]
      summary: Get hourly call volume for today
      responses:
        "200":
          description: Hourly call volume
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HourlyVolume"

  /vendor-invoices/kpis:
    get:
      operationId: getVendorInvoiceKpis
      tags: [vendor-invoices]
      summary: Get vendor invoice KPIs
      responses:
        "200":
          description: Vendor invoice KPIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorInvoiceKpis"

  /vendor-invoices/list:
    get:
      operationId: getVendorInvoiceList
      tags: [vendor-invoices]
      summary: Get vendor invoice list
      parameters:
        - name: vendor
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: workNumber
          in: query
          schema:
            type: string
        - name: serviceCategory
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Vendor invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VendorInvoice"

  /vendor-invoices/aging:
    get:
      operationId: getVendorInvoiceAging
      tags: [vendor-invoices]
      summary: Get invoice aging by vendor
      responses:
        "200":
          description: Aging summary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VendorAgingRow"

  /vendor-invoices/alerts:
    get:
      operationId: getVendorInvoiceAlerts
      tags: [vendor-invoices]
      summary: Get vendor invoice alerts
      responses:
        "200":
          description: Vendor invoice alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VendorInvoiceAlert"

  /applications/health:
    get:
      operationId: getApplicationHealth
      tags: [applications]
      summary: Get application health overview
      responses:
        "200":
          description: Application health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationHealthOverview"

  /applications/list:
    get:
      operationId: getApplicationList
      tags: [applications]
      summary: Get full list of applications with health
      responses:
        "200":
          description: Application list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"

  /applications/incidents:
    get:
      operationId: getIncidents
      tags: [applications]
      summary: Get incidents by severity
      parameters:
        - name: severity
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Incidents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Incident"

  /applications/batch-jobs:
    get:
      operationId: getBatchJobs
      tags: [applications]
      summary: Get batch job status
      responses:
        "200":
          description: Batch jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BatchJob"

  /applications/interfaces:
    get:
      operationId: getInterfaceHealth
      tags: [applications]
      summary: Get data interface health
      responses:
        "200":
          description: Interface health
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DataInterface"

  /applications/sla:
    get:
      operationId: getSlaCompliance
      tags: [applications]
      summary: Get SLA compliance by tower
      responses:
        "200":
          description: SLA compliance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SlaCompliance"

  /applications/kpis:
    get:
      operationId: getApplicationKpis
      tags: [applications]
      summary: Get application health KPIs
      responses:
        "200":
          description: Application KPIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationKpis"

  /ibmams/kpis:
    get:
      operationId: getIbmAmsKpis
      tags: [ibmams]
      summary: Get IBM AMS value KPIs
      responses:
        "200":
          description: IBM AMS KPIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IbmAmsKpis"

  /ibmams/ticket-trends:
    get:
      operationId: getTicketTrends
      tags: [ibmams]
      summary: Get ticket volume trend over time
      responses:
        "200":
          description: Ticket trends
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TicketTrend"

  /ibmams/automation-runbooks:
    get:
      operationId: getAutomationRunbooks
      tags: [ibmams]
      summary: Get automation runbook executions
      responses:
        "200":
          description: Automation runbooks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AutomationRunbook"

  /ibmams/savings:
    get:
      operationId: getCostSavings
      tags: [ibmams]
      summary: Get cost savings and avoidance metrics
      responses:
        "200":
          description: Cost savings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostSavings"

  /ibmams/ai-insights:
    get:
      operationId: getAiInsights
      tags: [ibmams]
      summary: Get AI-generated insights and anomalies
      responses:
        "200":
          description: AI insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiInsight"

  /ibmams/ask:
    post:
      operationId: askDashboard
      tags: [ibmams]
      summary: Ask the dashboard a question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskRequest"
      responses:
        "200":
          description: Answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskResponse"

  /roadmap/initiatives:
    get:
      operationId: getRoadmapInitiatives
      tags: [roadmap]
      summary: List all roadmap initiatives
      parameters:
        - in: query
          name: portfolio
          schema:
            type: string
        - in: query
          name: initiativeType
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: priority
          schema:
            type: string
        - in: query
          name: serviceCategory
          schema:
            type: string
      responses:
        "200":
          description: List of roadmap initiatives
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoadmapInitiative"
    post:
      operationId: createRoadmapInitiative
      tags: [roadmap]
      summary: Create a new roadmap initiative
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoadmapInitiativeRequest"
      responses:
        "201":
          description: Created initiative
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoadmapInitiative"

  /roadmap/summary:
    get:
      operationId: getRoadmapSummary
      tags: [roadmap]
      summary: Get roadmap summary counts
      responses:
        "200":
          description: Summary counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoadmapSummary"

  /roadmap/alerts:
    get:
      operationId: getRoadmapAlerts
      tags: [roadmap]
      summary: Get roadmap delay and risk alerts
      responses:
        "200":
          description: List of roadmap alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoadmapAlert"

  /roadmap/initiatives/{id}/status:
    patch:
      operationId: updateRoadmapInitiativeStatus
      tags: [roadmap]
      summary: Update the status of a roadmap initiative
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [Active, Planned, Completed, "At Risk"]
              required:
                - status
      responses:
        "200":
          description: Updated initiative
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoadmapInitiative"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message

    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password

    LoginResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
      required:
        - user
        - token

    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [executive, operations, it, support, ibm_delivery]
        email:
          type: string
        avatar:
          type: string
      required:
        - id
        - username
        - name
        - role
        - email

    KpiMetric:
      type: object
      properties:
        value:
          type: number
        formatted:
          type: string
        change:
          type: number
        changeLabel:
          type: string
        status:
          type: string
          enum: [green, yellow, red]
        trend:
          type: string
          enum: [up, down, flat]
      required:
        - value
        - formatted
        - status
        - trend

    ExecutiveKpis:
      type: object
      properties:
        activeMembers:
          $ref: "#/components/schemas/KpiMetric"
        newEnrollmentsToday:
          $ref: "#/components/schemas/KpiMetric"
        claimsReceivedToday:
          $ref: "#/components/schemas/KpiMetric"
        claimsSettledAmount:
          $ref: "#/components/schemas/KpiMetric"
        priorAuthRequests:
          $ref: "#/components/schemas/KpiMetric"
        openProviderTickets:
          $ref: "#/components/schemas/KpiMetric"
        callCenterASA:
          $ref: "#/components/schemas/KpiMetric"
        applicationAvailability:
          $ref: "#/components/schemas/KpiMetric"
        criticalIncidents:
          $ref: "#/components/schemas/KpiMetric"
        slaAttainment:
          $ref: "#/components/schemas/KpiMetric"
        batchSuccessRate:
          $ref: "#/components/schemas/KpiMetric"
        automationSavings:
          $ref: "#/components/schemas/KpiMetric"
      required:
        - activeMembers
        - newEnrollmentsToday
        - claimsReceivedToday
        - claimsSettledAmount
        - priorAuthRequests
        - openProviderTickets
        - callCenterASA
        - applicationAvailability
        - criticalIncidents
        - slaAttainment
        - batchSuccessRate
        - automationSavings

    Alert:
      type: object
      properties:
        id:
          type: string
        severity:
          type: string
          enum: [critical, high, medium, low]
        category:
          type: string
        title:
          type: string
        description:
          type: string
        timestamp:
          type: string
        status:
          type: string
          enum: [active, acknowledged, resolved]
        impactedSystem:
          type: string
        drillDownPath:
          type: string
      required:
        - id
        - severity
        - category
        - title
        - description
        - timestamp
        - status

    OperationsSnapshot:
      type: object
      properties:
        businessHealth:
          type: string
          enum: [healthy, degraded, critical]
        itHealth:
          type: string
          enum: [healthy, degraded, critical]
        businessSummary:
          type: string
        itSummary:
          type: string
        highlights:
          type: array
          items:
            type: string
        watchItems:
          type: array
          items:
            type: string
        lastUpdated:
          type: string
      required:
        - businessHealth
        - itHealth
        - businessSummary
        - itSummary
        - highlights
        - watchItems
        - lastUpdated

    TrendDataPoint:
      type: object
      properties:
        date:
          type: string
        claims:
          type: number
        enrollments:
          type: number
        priorAuths:
          type: number
        availability:
          type: number
        incidents:
          type: number
      required:
        - date
        - claims
        - enrollments
        - priorAuths
        - availability
        - incidents

    TrendData:
      type: object
      properties:
        points:
          type: array
          items:
            $ref: "#/components/schemas/TrendDataPoint"
        period:
          type: string
      required:
        - points
        - period

    MemberKpis:
      type: object
      properties:
        totalActiveMembers:
          $ref: "#/components/schemas/KpiMetric"
        newEnrollmentsToday:
          $ref: "#/components/schemas/KpiMetric"
        newEnrollmentsWeek:
          $ref: "#/components/schemas/KpiMetric"
        newEnrollmentsMonth:
          $ref: "#/components/schemas/KpiMetric"
        terminations:
          $ref: "#/components/schemas/KpiMetric"
        exceptionQueueSize:
          $ref: "#/components/schemas/KpiMetric"
        idCardsPending:
          $ref: "#/components/schemas/KpiMetric"
        eligibilityLatency:
          $ref: "#/components/schemas/KpiMetric"
      required:
        - totalActiveMembers
        - newEnrollmentsToday
        - newEnrollmentsWeek
